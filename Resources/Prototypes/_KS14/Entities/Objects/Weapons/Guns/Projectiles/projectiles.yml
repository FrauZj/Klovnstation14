- type: entity
  id: ButchersHookProjectile
  name: butcher's hook
  categories: [ HideSpawnMenu ]
  components:
    - type: EmbeddableProjectile
      deleteOnRemove: true
    - type: InteractionOutline
    - type: Sprite
      noRot: false
      sprite: Objects/Weapons/Guns/Launchers/grappling_gun.rsi
      layers:
        - state: hook
    - type: Physics
      bodyType: Dynamic
    - type: TileFrictionModifier
      modifier: 0
    - type: Projectile
      deleteOnCollide: false
      damage:
        types:
          Slash: 12
    - type: Fixtures
      fixtures:
        projectile:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.1,-0.1,0.1,0.1"
          hard: false
          mask:
            - MobLayer
    - type: ButchersHookProjectile
