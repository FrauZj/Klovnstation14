- type: entity
  id: ButcherHook
  name: ButcherHook
  categories: [ HideSpawnMenu ]
  components:
    - type: InteractionOutline
    - type: Sprite
      noRot: false
      sprite: Objects/Weapons/Guns/Launchers/grappling_gun.rsi
      layers:
        - state: hook
    - type: Physics
      bodyType: Dynamic
    - type: TileFrictionModifier
      modifier: 0
    - type: Projectile
      deleteOnCollide: true
      damage:
        types:
          Slash: 25
    - type: Fixtures
      fixtures:
        projectile:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.1,-0.1,0.1,0.1"
          hard: false
          mask:
            - Impassable
            - HighImpassable
    - type: GrapplingProjectile
