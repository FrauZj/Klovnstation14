- type: entity
  parent: BloodstreamStatusEffectBase
  id: StatusEffectSafeCritHumanoid
  name: safe-crit
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
      - MobThresholds
  - type: ModifiedMobThresholdsStatusEffect
    thresholdAdjustments: #additions
      Critical: 100
      Dead: 200

- type: entity
  parent: BloodstreamStatusEffectBase
  id: StatusEffectWeightlessnessHumanoid
  name: weightlessness
  components:
  - type: StatusEffect
    whitelist:
      components:
      - Physics
  - type: WeightlessnessStatusEffect

# Holds off what a failed or missing liver does to the body. See KsOrganHealthSystem.
- type: entity
  parent: BloodstreamStatusEffectBase
  id: StatusEffectKsStableLiver
  name: stable-liver
  components:
  - type: KsStableOrgansStatusEffect
    organs: [ Liver ]
