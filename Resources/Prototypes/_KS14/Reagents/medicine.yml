- type: reagent
  id: Seiver
  name: reagent-name-seiver
  group: Medicine
  desc: reagent-desc-seiver
  physicalDesc: reagent-physical-desc-thin
  flavor: metallic
  color: "#5A7D9A"
  metabolisms:
