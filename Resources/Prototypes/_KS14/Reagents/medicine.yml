## Mixed

# tg granibitaluri (expensive: salt and sulfuric acid): slow, and only okay on small injuries: from 40 brute and burn
#     together it heals less than half as much. tg's 50u overdose poisons and wears out the liver.
- type: reagent
  id: Granibitaluri
  name: reagent-name-granibitaluri
  group: Medicine
  desc: reagent-desc-granibitaluri
  physicalDesc: reagent-physical-desc-chalky
  flavor: chalky
  color: "#E0E0E0"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.25
      effects:
      - !type:EvenHealthChange
        conditions:
        - !type:KsDamageCondition
          groups:
          - Brute
          - Burn
          max: 40
        damage:
          Brute: -0.5
          Burn: -0.5
      - !type:EvenHealthChange
        conditions:
        - !type:KsDamageCondition
          groups:
          - Brute
          - Burn
          min: 40
        damage:
          Brute: -0.2
          Burn: -0.2
      - !type:KsAdjustOrganDamage
        conditions:
        - !type:ReagentCondition
          reagent: Granibitaluri
          min: 50
        organ: Liver
        amount: 0.1
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Granibitaluri
          min: 50
        damage:
          types:
            Poison: 0.1
