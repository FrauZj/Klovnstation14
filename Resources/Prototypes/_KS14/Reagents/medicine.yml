# Medicine ported from tgstation for organ health (see KsOrganHealthSystem). Healing medicine follows the organ-health
#     skill's tiers, set by how hard the recipe is here, measured against bicaridine (0.25u a second, 1 brute a second):
#     - simple (one reaction from the dispenser) or expensive (an intermediate first, like bicaridine): no better than
#       bicaridine. Either slow and okay (about 0.25u and 1 healed a second) or fast and weak (about 1u a second for as
#       much or less), and always with a cost, usually tg's.
#     - hard (heated or rare intermediates, like phenol, or ingredients the dispenser doesn't have): normal healing,
#       about 2 a second, with whatever downside tg gives it.

# tg higadrite: holds off what a failed or missing liver does, for as long as it lasts. It heals nothing.
- type: reagent
  id: Higadrite
  name: reagent-name-higadrite
  group: Medicine
  desc: reagent-desc-higadrite
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#c9a93a"
  ksSelfConsuming: true
  metabolisms:
    Bloodstream:
      metabolismRate: 0.2
      effects:
      - !type:ModifyStatusEffect
        effectProto: StatusEffectKsStableLiver
        time: 2
        type: Update

# tg syriniver (hard): a strong antitoxin that flushes out other reagents, at the liver's expense. 6u is an overdose.
- type: reagent
  id: Syriniver
  name: reagent-name-syriniver
  group: Medicine
  desc: reagent-desc-syriniver
  physicalDesc: reagent-physical-desc-opaque
  flavor: medicine
  color: "#6e5f8c"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.15
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: -2
      - !type:CleanBloodstream
        excluded: Syriniver
        cleanseRate: 0.2
      - !type:KsAdjustOrganDamage
        organ: Liver
        amount: 0.4
      - !type:KsAdjustOrganDamage
        conditions:
        - !type:ReagentCondition
          reagent: Syriniver
          min: 6
        organ: Liver
        amount: 0.75
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Syriniver
          min: 6
        type: Local
        visualType: Medium
        messages: [ generic-reagent-effect-nauseous ]
        probability: 0.1

# tg inacusiate: heals the ears, 10 a unit.
- type: reagent
  id: Inacusiate
  name: reagent-name-inacusiate
  group: Medicine
  desc: reagent-desc-inacusiate
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#606060"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.2
      effects:
      - !type:KsAdjustOrganDamage
        organ: Ears
        amount: -2

## Brute

# tg helbital (simple): heals bruises the closer the patient is to death. Conscious, it heals little and suffocates
#     them, as tg's does; in crit it heals more for less. Fast and weak: 1u a second. tg's overdose curses the patient
#     with blindness and wasting.
- type: reagent
  id: Helbital
  name: reagent-name-helbital
  group: Medicine
  desc: reagent-desc-helbital
  physicalDesc: reagent-physical-desc-cloudy
  flavor: cold
  color: "#9400D3"
  metabolisms:
    Bloodstream:
      metabolismRate: 1
      effects:
      - !type:EvenHealthChange
        conditions:
        - !type:MobStateCondition
          mobstate: Alive
        damage:
          Brute: -1
      - !type:HealthChange
        conditions:
        - !type:MobStateCondition
          mobstate: Alive
        damage:
          types:
            Asphyxiation: 0.75
      - !type:EvenHealthChange
        conditions:
        - !type:MobStateCondition
          mobstate: Critical
        damage:
          Brute: -2
      - !type:HealthChange
        conditions:
        - !type:MobStateCondition
          mobstate: Critical
        damage:
          types:
            Asphyxiation: 0.25
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Helbital
          min: 35
        effectProto: StatusEffectBlindness
        time: 2
        type: Update
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Helbital
          min: 35
        damage:
          types:
            Poison: 1

# tg libital (hard here: phenol): bicaridine's healing at twice the speed, and minor liver damage. That is in the
#     blood, so injecting it doesn't spare the liver: 0.1 for every brute healed, as tg's.
- type: reagent
  id: Libital
  name: reagent-name-libital
  group: Medicine
  desc: reagent-desc-libital
  physicalDesc: reagent-physical-desc-opaque
  flavor: bitter
  color: "#ECEC8D"
  metabolisms:
    Bloodstream:
      effects:
      - !type:EvenHealthChange
        damage:
          Brute: -2
      - !type:KsAdjustOrganDamage
        organ: Liver
        amount: 0.2

# tg salicylic acid (hard): heals severe bruising quickly and minor bruising slowly, an eighth as fast, as tg's. An
#     overdose makes bruises that are already there worse.
- type: reagent
  id: SalicylicAcid
  name: reagent-name-salicylic-acid
  group: Medicine
  desc: reagent-desc-salicylic-acid
  physicalDesc: reagent-physical-desc-crystalline
  flavor: sour
  color: "#D2D2D2"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.25
      effects:
      - !type:EvenHealthChange
        conditions:
        - !type:KsDamageCondition
          groups:
          - Brute
          min: 25
        damage:
          Brute: -2
      - !type:EvenHealthChange
        conditions:
        - !type:KsDamageCondition
          groups:
          - Brute
          max: 25
        damage:
          Brute: -0.25
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: SalicylicAcid
          min: 25
        - !type:KsDamageCondition
          groups:
          - Brute
          min: 1
        damage:
          types:
            Blunt: 2.25

